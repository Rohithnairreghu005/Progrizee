name: AI owner transition
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Approved issue number
        required: true
        type: number
      target:
        description: Evidence-backed status
        required: true
        type: choice
        options: [Backlog, Ready, In Progress, Code Review, Testing]
      evidence:
        description: Approval or verification evidence (20–2000 characters)
        required: true
        type: string
      dry_run:
        description: Verify read access and item lookup; write access remains unverified
        required: true
        type: boolean
        default: true
permissions:
  contents: read
  issues: write
concurrency:
  group: heard-ai-coordinator
  cancel-in-progress: false
jobs:
  transition:
    if: github.actor == 'Rohithnairreghu005' && github.ref == 'refs/heads/main'
    environment: ai-workers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate and update board
        env:
          GH_TOKEN: ${{ secrets.HEARD_PROJECT_TOKEN }}
          GH_ISSUE_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          TARGET_STATUS: ${{ inputs.target }}
          TRANSITION_EVIDENCE: ${{ inputs.evidence }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node automation/transition.mjs
